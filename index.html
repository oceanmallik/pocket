<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; }
        #sidebar { width: 250px; border-right: 1px solid #ccc; padding: 10px; height: 100vh; overflow-y: auto; }
        #content { flex-grow: 1; padding: 20px; }
        .folder { font-weight: bold; margin-top: 10px; cursor: pointer; }
        .file { margin-left: 15px; color: blue; cursor: pointer; text-decoration: underline; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Pocket Files</h3>
        <div id="file-tree">Loading...</div>
    </div>

    <div id="content">
        <h2 id="file-title">Select a file</h2>
        <pre><code id="file-display">Code will appear here...</code></pre>
    </div>

    <script>
        async function loadTree() {
            const response = await fetch('tree.json');
            const tree = await response.json();
            const treeContainer = document.getElementById('file-tree');
            treeContainer.innerHTML = '';
            buildDOMTree(tree, treeContainer);
        }

        function buildDOMTree(nodes, parentElement) {
            nodes.forEach(node => {
                const div = document.createElement('div');
                if (node.type === 'folder') {
                    div.className = 'folder';
                    div.textContent = '📁 ' + node.name;
                    const childrenContainer = document.createElement('div');
                    childrenContainer.style.display = 'block'; // Or 'none' to make it collapsible
                    buildDOMTree(node.children, childrenContainer);
                    div.appendChild(childrenContainer);
                } else {
                    div.className = 'file';
                    div.textContent = '📄 ' + node.name;
                    div.onclick = () => loadFile(node.path, node.name);
                }
                parentElement.appendChild(div);
            });
        }

        async function loadFile(path, name) {
            document.getElementById('file-title').textContent = name;
            const response = await fetch(path);
            const text = await response.text();
            document.getElementById('file-display').textContent = text;
        }

        loadTree();
    </script>
</body>
</html>
