<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

    <div id="sidebar">
        <h3>Pocket Files</h3>
        <div id="file-tree">Loading...</div>
    </div>

    <div id="content">
        <button id="mobile-menu-btn">☰ Browse Files</button>
        <h2 id="file-title">Select a file</h2>
        <div class="code-container">
            <div class="decor-window">
                <div class="decor-header">
                    <div class="decor-dot close"></div>
                    <div class="decor-dot minimize"></div>
                    <div class="decor-dot maximize"></div>
                </div>
                <pre><code id="file-display">Code will appear here...</code></pre>
            </div>
        </div>
    </div>

    <script>
        async function loadTree() {
            const response = await fetch('tree.json');
            const tree = await response.json();
            const treeContainer = document.getElementById('file-tree');
            treeContainer.innerHTML = '';
            buildDOMTree(tree, treeContainer);
        }

        function buildDOMTree(nodes, parentElement) {
            nodes.forEach(node => {
                const div = document.createElement('div');
                if (node.type === 'folder') {
                    div.className = 'folder';
                    div.textContent = '📁 ' + node.name;
                    const childrenContainer = document.createElement('div');
                    childrenContainer.style.display = 'block';
                    buildDOMTree(node.children, childrenContainer);
                    div.appendChild(childrenContainer);
                } else {
                    div.className = 'file';
                    div.textContent = '📄 ' + node.name;
                    div.onclick = () => loadFile(node.path, node.name);
                }
                parentElement.appendChild(div);
            });
        }

        async function loadFile(path, name) {
            document.getElementById('file-title').textContent = name;

            const response = await fetch(path);
            const text = await response.text();

            const codeDisplay = document.getElementById('file-display');
            codeDisplay.textContent = text;
            codeDisplay.className = '';
            codeDisplay.removeAttribute('data-highlighted');

            hljs.highlightElement(codeDisplay);

            document.getElementById('sidebar').classList.remove('open');
        }

        loadTree();

        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
    </script>
</body>

</html>
